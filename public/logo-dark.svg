<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 68" width="230" height="68">
  <defs>
    <linearGradient id="iconGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d8af0"/>
      <stop offset="100%" stop-color="#5b6de8"/>
    </linearGradient>
  </defs>

  <!-- Icon square -->
  <rect x="2" y="2" width="62" height="62" rx="17" fill="url(#iconGradD)"/>

  <!-- Tooth crown -->
  <rect x="17" y="11" width="30" height="22" rx="9" fill="white" opacity="0.96"/>
  <!-- Left root -->
  <rect x="17" y="30" width="12" height="17" rx="5" fill="white" opacity="0.96"/>
  <!-- Right root -->
  <rect x="37" y="30" width="12" height="17" rx="5" fill="white" opacity="0.96"/>
  <!-- Smile arc on tooth -->
  <path d="M22 23 Q32 31 44 23" stroke="#4d8af0" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Brand text — dark version for light backgrounds -->
  <text x="78" y="36" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1a2236">Medi<tspan fill="#4d8af0">Smile</tspan></text>

  <!-- Tagline -->
  <text x="79" y="53" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8896b0" letter-spacing="1.2">CLINIQUE DENTAIRE</text>
</svg>
